name: Update Space Weather Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetches all history for proper versioning
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        # 🔧 FIX: This tells the action to look for package-lock.json in ANY directory
        cache-dependency-path: '**/package-lock.json'
    
    - name: Install dependencies
      run: |
        # Use npm ci for clean, reproducible installs (requires package-lock.json)
        npm ci
        # If the above fails, fall back to regular install
        # npm install
    
    - name: Run data update
      run: node scripts/update-data.js
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/
        # Only commit if there are actual changes
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        fi
