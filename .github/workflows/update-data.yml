name: Update Space Weather Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:        # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetches all history for proper versioning
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        # 🔧 CACHING HAS BEEN REMOVED TO RESOLVE THE ERROR
    
    - name: Install dependencies
      run: |
        # Check for lockfile and use the appropriate install command
        if [ -f package-lock.json ]; then
          npm ci
        else
          echo "No package-lock.json found. Running 'npm install' instead."
          npm install
        fi
    
    - name: Run data update
      run: node scripts/update-data.js
    
    - name: Commit and push if changed
      env:
        # 🔧 CRITICAL: Token for authentication
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/
        # Only commit if there are actual changes
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Push using the authenticated token
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        fi
