<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Space Weather Dashboard • ournightsky.us</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- [ALL CSS STYLES REMAIN EXACTLY THE SAME - DO NOT CHANGE] -->
  <style>
    /* [PASTE ALL YOUR EXISTING CSS HERE - DO NOT MODIFY] */
    :root { --bg: #0a0e17; --card: rgba(20, 25, 45, 0.85); /* ... etc ... */ }
    /* [KEEP ALL ORIGINAL CSS] */
  </style>
</head>
<body>
  <!-- [ALL HTML STRUCTURE REMAINS EXACTLY THE SAME] -->
  <header>
    <div class="container header-content">
      <h1><i class="fas fa-satellite"></i>Live Space Weather<small style="font-size: 0.6em; color: var(--cyan)">v2.0</small></h1>
      <div class="header-actions">
        <div style="color: var(--text-muted); display: flex; align-items: center; gap: 1rem;">
          <span><i class="fas fa-clock"></i> Updated: <strong id="update-time">--:--</strong></span>
          <span><i class="fas fa-sync-alt"></i> Auto-refresh: <strong>2 min</strong></span>
        </div>
        <div class="controls">
          <button id="refresh-btn" class="btn"><i class="fas fa-sync-alt"></i> Refresh Now</button>
          <button id="settings-btn" class="btn btn-outline" title="Settings"><i class="fas fa-cog"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="dashboard">
      <!-- [ALL CARDS REMAIN EXACTLY THE SAME] -->
      <div class="card hero-card"><!-- Hero Card --></div>
      <div class="card aurora-map"><!-- Aurora Map --></div>
      <div class="card iss-tracking"><!-- ISS Tracking --></div>
      <div class="card solar-activity"><!-- Solar Activity --></div>
      <div class="card geomagnetic"><!-- Geomagnetic --></div>
      <div class="card radiation"><!-- Radiation --></div>
      <div class="card news-feed"><!-- News Feed --></div>
      <div class="card graphs"><!-- Graphs --></div>
      <div class="card forecast"><!-- Aurora Forecast --></div>
      <div class="card meteor-activity"><!-- Meteor Activity --></div>
      <div class="card system-status"><!-- System Status --></div>
    </div>
  </main>

  <footer>
    <!-- [FOOTER REMAINS THE SAME] -->
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // FIXED DATA URLS - These now match your script's output
    const DATA_URLS = {
      noaa: 'data/noaa-data.json',
      aurora: 'data/aurora.json',
      news: 'data/news.json',
      status: 'data/update-status.json',
      xray: 'data/xray-data.json',
      dst: 'data/dst-data.json',
      meteor: 'data/meteor.json'
    };

    // [KEEP ALL YOUR EXISTING JAVASCRIPT VARIABLES AND FUNCTIONS, BUT UPDATE THESE FUNCTIONS:]

    // FIXED: Update KP Data function
    function updateKPData(data) {
      if (!data) return;
      
      let kpValue = 3.0;
      
      // Handle data from your script's structure
      if (data.kpIndex && Array.isArray(data.kpIndex) && data.kpIndex.length > 0) {
        // Your script returns arrays like ["2025-12-15 12:00", 3.67]
        const lastEntry = data.kpIndex[data.kpIndex.length - 1];
        if (Array.isArray(lastEntry) && lastEntry.length > 1) {
          kpValue = parseFloat(lastEntry[1]) || 3.0;
        }
      }
      
      elements.kpValue.textContent = kpValue.toFixed(1);
      updateGaugeCircle(elements.kpCircle, kpValue, 9);
      updateStatusBadge(elements.kpStatus, kpValue, { good: 4, warning: 6, alert: 8 });
      
      // Update aurora alert
      if (kpValue >= 6) {
        elements.auroraAlert.innerHTML = `<span style="color: #ff5500">🌌 Aurora Alert! Kp ${kpValue.toFixed(1)} - Visible at mid-latitudes</span>`;
      } else if (kpValue >= 4) {
        elements.auroraAlert.innerHTML = `<span style="color: #00d4ff">✨ Aurora possible at high latitudes (Kp ${kpValue.toFixed(1)})</span>`;
      } else {
        elements.auroraAlert.innerHTML = `<span style="color: var(--text-muted)">Quiet aurora conditions (Kp ${kpValue.toFixed(1)})</span>`;
      }
      
      // Update visualization
      createAuroraVisualization(kpValue);
    }

    // FIXED: Update Solar Data function
    function updateSolarData(data) {
      if (!data) {
        elements.solarData.innerHTML = '<div class="data-item">Solar data unavailable</div>';
        return;
      }
      
      let html = '<div class="data-list">';
      
      // Solar Wind - your script returns an array
      if (data.solarWind && Array.isArray(data.solarWind) && data.solarWind.length >= 3) {
        html += `
          <div class="data-item">
            <span class="data-label">Wind Speed</span>
            <span class="data-value">${data.solarWind[2] || '--'} km/s</span>
          </div>
          <div class="data-item">
            <span class="data-label">Density</span>
            <span class="data-value">${data.solarWind[1] || '--'} p/cm³</span>
          </div>
        `;
      } else {
        html += '<div class="data-item">Solar wind data unavailable</div>';
      }
      
      // Solar Flares
      if (data.solarFlares && data.solarFlares.length > 0) {
        data.solarFlares.slice(-3).forEach(flare => {
          const flareClass = flare.class || 'Unknown';
          const flareLetter = flareClass.charAt(0).toUpperCase();
          html += `
            <div class="data-item ${flareLetter === 'M' || flareLetter === 'X' ? 'alert' : 'warning'}">
              <span class="data-label">${flareClass} Flare</span>
              <span class="data-value"><span class="flare-${flareLetter.toLowerCase()} flare-badge">${flareLetter}</span></span>
            </div>
          `;
        });
      } else {
        html += '<div class="data-item success">No recent solar flares</div>';
      }
      
      html += '</div>';
      elements.solarData.innerHTML = html;
    }

    // FIXED: Update X-ray Data function
    function updateXrayData(data) {
      if (!data) return;
      
      elements.xrayValue.textContent = data.current || "A0.0";
      
      // Convert X-ray class to numeric for gauge
      let gaugeValue = data.numeric || 0;
      
      updateGaugeCircle(elements.xrayCircle, gaugeValue, 10);
      
      // Update status based on class
      let statusText = 'Good';
      let statusClass = 'status-good';
      
      if (data.class === 'X' || data.class === 'M') {
        statusText = 'Alert';
        statusClass = 'status-alert';
      } else if (data.class === 'C') {
        statusText = 'Warning';
        statusClass = 'status-warning';
      }
      
      elements.xrayStatus.className = `gauge-status ${statusClass}`;
      elements.xrayStatus.textContent = statusText;
    }

    // FIXED: Update Dst Data function
    function updateDstData(data) {
      if (!data) return;
      
      const dstValue = data.current || 0;
      const absValue = Math.abs(dstValue);
      
      elements.dstValue.textContent = dstValue;
      updateGaugeCircle(elements.dstCircle, absValue, 100);
      
      // Update status based on storm level
      let statusClass = 'status-good';
      if (data.stormLevel === 'Severe' || data.stormLevel === 'Strong') {
        statusClass = 'status-alert';
      } else if (data.stormLevel === 'Moderate') {
        statusClass = 'status-warning';
      }
      
      elements.dstStatus.className = `gauge-status ${statusClass}`;
      elements.dstStatus.textContent = data.stormLevel || 'Quiet';
    }

    // FIXED: Update Aurora Forecast function
    function updateAuroraForecast(data) {
      if (!data) {
        elements.auroraForecast.innerHTML = '<div class="data-item">Aurora forecast unavailable</div>';
        return;
      }
      
      const forecast = data.forecast || "Aurora data updating...";
      const kpIndex = data.kpIndex || '--';
      const probability = data.probability || 'Low';
      
      elements.auroraForecast.innerHTML = `
        <div class="data-list">
          <div class="data-item ${probability === 'High' ? 'alert' : probability === 'Moderate' ? 'warning' : 'success'}">
            <span class="data-label">Probability</span>
            <span class="data-value">${probability}</span>
          </div>
          <div class="data-item">
            <span class="data-label">Current Kp</span>
            <span class="data-value">${kpIndex}</span>
          </div>
          <div class="data-item">
            <span class="data-label">Best Viewing</span>
            <span class="data-value">${data.bestViewing || 'Not favorable'}</span>
          </div>
          <div class="data-item" style="grid-column: 1 / -1;">
            <span class="data-label">Forecast</span>
            <span class="data-value" style="font-size: 0.9rem;">${forecast}</span>
          </div>
        </div>
      `;
    }

    // FIXED: Update Meteor Data function
    function updateMeteorData(data) {
      if (!data) {
        elements.meteorData.innerHTML = '<div class="data-item">Meteor data unavailable</div>';
        return;
      }
      
      const current = data.current || 0;
      const activity = data.activity || 'Low';
      const description = data.description || 'Background meteor activity';
      
      let html = '<div class="data-list">';
      html += `
        <div class="data-item ${activity === 'High' ? 'warning' : activity === 'Moderate-High' ? 'warning' : 'success'}">
          <span class="data-label">Activity Level</span>
          <span class="data-value">${current}/10</span>
        </div>
        <div class="data-item">
          <span class="data-label">Status</span>
          <span class="data-value">${activity}</span>
        </div>
      `;
      
      if (data.activeShowers && data.activeShowers.length > 0) {
        data.activeShowers.forEach(shower => {
          html += `
            <div class="data-item warning">
              <span class="data-label">${shower.name}</span>
              <span class="data-value">${shower.zhr || '--'} ZHR</span>
            </div>
            <div class="data-item" style="grid-column: 1 / -1; font-size: 0.8rem; color: var(--text-muted);">
              ${shower.description || ''}
            </div>
          `;
        });
      }
      
      if (data.nextMajorShower) {
        html += `
          <div class="data-item" style="margin-top: 0.5rem; border-top: 1px solid var(--border); padding-top: 0.5rem;">
            <span class="data-label">Next: ${data.nextMajorShower.name}</span>
            <span class="data-value">${data.nextMajorShower.date}</span>
          </div>
        `;
      }
      
      html += '</div>';
      elements.meteorData.innerHTML = html;
      
      // Update meteor status badge
      let statusClass = 'status-good';
      if (activity === 'High' || activity === 'Moderate-High') {
        statusClass = 'status-warning';
      }
      document.getElementById('meteor-status').className = `gauge-status ${statusClass}`;
      document.getElementById('meteor-status').textContent = activity;
    }

    // FIXED: Update Radiation Data function
    function updateRadiationData(data) {
      if (!data) {
        elements.radiationData.innerHTML = '<div class="data-item">Radiation data unavailable</div>';
        return;
      }
      
      const xrayClass = data.current || "A0.0";
      const description = data.description || "Normal solar activity";
      
      elements.radiationData.innerHTML = `
        <div class="data-list">
          <div class="data-item ${data.class === 'X' || data.class === 'M' ? 'alert' : data.class === 'C' ? 'warning' : 'success'}">
            <span class="data-label">X-ray Flux</span>
            <span class="data-value">${xrayClass}</span>
          </div>
          <div class="data-item">
            <span class="data-label">Status</span>
            <span class="data-value" style="font-size: 0.9rem;">${description}</span>
          </div>
        </div>
      `;
      
      // Update radiation status badge
      let statusClass = 'status-good';
      let statusText = 'Safe';
      if (data.class === 'X' || data.class === 'M') {
        statusClass = 'status-alert';
        statusText = 'Elevated';
      } else if (data.class === 'C') {
        statusClass = 'status-warning';
        statusText = 'Moderate';
      }
      document.getElementById('rad-status').className = `gauge-status ${statusClass}`;
      document.getElementById('rad-status').textContent = statusText;
    }

    // FIXED: Update Geomagnetic Data function
    function updateGeomagneticData(data) {
      if (!data) {
        elements.geomagneticData.innerHTML = '<div class="data-item">Geomagnetic data unavailable</div>';
        return;
      }
      
      const dstValue = data.current || 0;
      const stormLevel = data.stormLevel || 'Quiet';
      const description = data.description || "Geomagnetic conditions quiet";
      
      elements.geomagneticData.innerHTML = `
        <div class="data-list">
          <div class="data-item ${stormLevel === 'Severe' || stormLevel === 'Strong' ? 'alert' : stormLevel === 'Moderate' ? 'warning' : 'success'}">
            <span class="data-label">Current Dst</span>
            <span class="data-value">${dstValue} nT</span>
          </div>
          <div class="data-item">
            <span class="data-label">Storm Level</span>
            <span class="data-value">${stormLevel}</span>
          </div>
          <div class="data-item" style="grid-column: 1 / -1;">
            <span class="data-label">Status</span>
            <span class="data-value" style="font-size: 0.9rem;">${description}</span>
          </div>
        </div>
      `;
      
      // Update geomagnetic status badge
      let statusClass = 'status-good';
      if (stormLevel === 'Severe' || stormLevel === 'Strong') {
        statusClass = 'status-alert';
      } else if (stormLevel === 'Moderate') {
        statusClass = 'status-warning';
      }
      document.getElementById('geo-status').className = `gauge-status ${statusClass}`;
      document.getElementById('geo-status').textContent = stormLevel;
    }

    // [KEEP ALL OTHER FUNCTIONS EXACTLY AS THEY ARE IN YOUR ORIGINAL HTML]
    // init(), initMaps(), initCharts(), setupEventListeners(), updateChart(),
    // updateGaugeCircle(), updateStatusBadge(), createAuroraVisualization(),
    // fetchData(), getFallbackData(), updateAll(), updateNewsData(),
    // fetchAndRenderNews(), updateSystemStatus(), updateChartData(),
    // updateISS(), updateNextUpdateTime(), showError()

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
